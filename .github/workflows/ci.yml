name: Checks

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  commit-kinds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Self-test of the check
        run: bash .github/scripts/check-commit-kinds-test.sh
      - name: Commits do not mix code and infrastructure
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.ref_name }}" != master ]; then
            range="origin/master..${{ github.sha }}"
          elif [ "${{ github.event.before }}" != 0000000000000000000000000000000000000000 ]; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="${{ github.sha }}^..${{ github.sha }}"
          fi
          bash .github/scripts/check-commit-kinds.sh "$range"

  pinned-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Toolchain cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/haxe-toolchain
          key: haxe-toolchain-${{ hashFiles('tools/setup.sh', 'tools/haxe-build.pin') }}
      - name: Provision the pinned compiler
        run: bash tools/setup.sh
      - name: Build all.hxml
        run: PATH="$PWD/tools:$PATH" HAXE_STD_PATH=.haxe/std .haxe/haxe all.hxml
